services:
  postgres:
    image: postgres:17@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
    container_name: cooper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cooper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cooperpass}
      POSTGRES_DB: ${POSTGRES_DB:-cooper}
      MB_DB_DBNAME: ${MB_DB_DBNAME:-metabase}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Use the same table definitions here and in the Python loader.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001_analytics.sql:ro
      - ./docker/postgres/init/002_metabase.sh:/docker-entrypoint-initdb.d/002_metabase.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-cooper} -d ${POSTGRES_DB:-cooper}"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    # Installed v0.63.18.1; update the digest deliberately when upgrading.
    image: metabase/metabase@sha256:0ad51a232989d57795e681f9e1171c92869d6c76004943340d9d9ac1f7644bda
    container_name: cooper-metabase
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${MB_DB_DBNAME:-metabase}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-cooper}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-cooperpass}
      MB_DB_HOST: postgres
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
